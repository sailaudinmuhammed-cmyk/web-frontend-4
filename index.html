<p class="text-secondary mb-2">Task 0 · Forms and validation</p>
<h1>Simple contact form</h1>
<p>A basic HTML form with labels for every field.</p>
<p class="small text-secondary">Practice form: submissions are checked locally. No data is sent or saved.</p>
<form class="basic-form" data-validation="native">
<div class="basic-field"><label class="form-label" for="name">Name</label><input id="name" name="name" type="text" autocomplete="name"></div><div class="basic-field"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"></div><div class="col-12 basic-field"><label class="form-label" for="message">Message</label><textarea id="message" name="message" rows="5" ></textarea></div>
<div class="col-12 actions"><button type="submit" class="">Submit</button> </div>
</form>
<p id="form-status" class="mt-3" role="status" aria-live="polite"></p>
