<p class="text-secondary mb-2">Task 1 · Forms and validation</p>
<h1>HTML5 validation</h1>
<p>Required fields and email format are checked by your browser.</p>
<p class="small text-secondary">Practice form: submissions are checked locally. No data is sent or saved.</p>
<form class="basic-form" data-validation="native">
<div class="basic-field"><label class="form-label" for="name">Name</label><input id="name" name="name" type="text" required maxlength="80" autocomplete="name"></div><div class="basic-field"><label class="form-label" for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"></div><div class="col-12 basic-field"><label class="form-label" for="message">Message</label><textarea id="message" name="message" rows="5" required maxlength="1000"></textarea></div>
<div class="col-12 actions"><button type="submit" class="">Submit</button> </div>
</form>
<p id="form-status" class="mt-3" role="status" aria-live="polite"></p>
</main>
